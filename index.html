<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#08090a" />

    <meta name="background-color" content="#08090a" />

    <meta
      name="description"
      content="Confeasy - Sua confeitaria em um só lugar."
    />

    <title>Confeasy</title>

    <!-- Ícone da aba do Chrome -->
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/favicon-48.png"
    />

    <!-- Ícone do Confeasy no iPhone/iPad -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon-180.png"
    />

    <!-- Manifesto do aplicativo -->
    <link
      rel="manifest"
      href="/manifest.json"
    />

    <!-- Configuração para o Confeasy funcionar como aplicativo no iPhone -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Confeasy"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
